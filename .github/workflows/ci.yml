name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun --version && bun install --frozen-lockfile
      - run: bash scripts/lint.sh
      - run: bash scripts/build.sh
      - run: bash scripts/test.sh
