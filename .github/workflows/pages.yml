name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun --version && bun install --frozen-lockfile
      - name: Build with annotation
        run: |
          set +e
          bun astro build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"
          if [ $rc -ne 0 ]; then
            echo "::group::astro build error"
            tail -80 /tmp/build.log
            echo "::endgroup::"
            tail -40 /tmp/build.log | sed 's/^/::error::/'
            exit $rc
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
